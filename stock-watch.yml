name: TCG Stock Watch

on:
  schedule:
    # Niet op :00/:15/:30/:45 — dat zijn de piekmomenten waarop GitHub
    # geplande runs het vaakst overslaat. Vandaar de schuine tijden.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-watch
  # Een vastgelopen run blokkeert nu niet meer alle volgende runs.
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check webshops
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Sla nieuwe status op
        run: |
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git config user.name "stock-watcher"
            git config user.email "actions@github.com"
            git add state/
            git commit -m "state: $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash || true
            git push
          else
            echo "Geen wijzigingen in state/"
          fi
