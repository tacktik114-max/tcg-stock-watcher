# ---------------------------------------------------------------
# TCG Stock Watcher — configuratie
# Shops getest op 8 september 2026 via diagnose_all.py
# ---------------------------------------------------------------

ntfy:
  server: https://ntfy.sh
  topic: ""          # leeg laten: komt uit het GitHub secret NTFY_TOPIC

settings:
  max_notifications: 20          # nieuwe producten: hierboven => één samenvatting per shop
  max_restock_notifications: 25  # restocks krijgen ALTIJD een eigen melding met link
  notify_price_drops: false
  notify_out_of_stock: false
  notify_errors: true

# ---------------------------------------------------------------
# Over de filters
#
#   include: filtert op woorden in de PRODUCTTITEL. De meeste shops
#            zetten "Pokémon" in de titel, maar niet allemaal. Krijg je
#            bij een shop 0 producten na filters, haal include dan leeg
#            (include: []) en kijk wat er binnenkomt. Levert dat alsnog
#            0 op, dan geeft de API van die shop niets terug: uitzetten.
#            Controleer dit in de logregel "X producten na filters (van Y)".
#   exclude: accessoires eruit, anders krijg je meldingen over sleeves.
#   max_price: laat leeg om alles te volgen.
# ---------------------------------------------------------------

sites:

  # ===== Shopify-shops =========================================
  - name: BeamCardShop
    enabled: true
    adapter: shopify
    base_url: https://beamcardshop.com
    max_pages: 4
    include: ["pokémon", "pokemon"]
    exclude: ["sleeve", "toploader", "binder", "playmat", "deck box"]

  - name: Bescards
    enabled: true
    adapter: shopify
