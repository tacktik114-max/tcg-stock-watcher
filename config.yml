# ---------------------------------------------------------------
# TCG Stock Watcher — configuratie
# Shops gevalideerd op 10 september 2026 via diagnose_all.py
# (bereikbaar + minimaal 40% kaartproducten in het assortiment)
# ---------------------------------------------------------------

ntfy:
  server: https://ntfy.sh
  topic: ""          # komt uit het GitHub secret NTFY_TOPIC

settings:
  max_notifications: 20          # nieuwe producten: hierboven => samenvatting per shop
  max_restock_notifications: 25  # restocks krijgen ALTIJD een eigen melding met link
  notify_price_drops: false
  notify_out_of_stock: false
  notify_errors: true

# ---------------------------------------------------------------
# include: filtert op woorden in de PRODUCTTITEL.
#   Staat overal aan op "pokémon"/"pokemon". Daardoor krijg je geen
#   Yu-Gi-Oh, One Piece of Digimon binnen bij shops die dat er ook bij
#   verkopen — en geen schoenen bij een shop die per ongeluk in de lijst
#   belandt. Nadeel: losse kaarten die alleen "Charizard ex 199/165"
#   heten vallen weg. Wil je die van een specifieke shop wél zien, zet
#   dan bij die shop include: [].
# ---------------------------------------------------------------

sites:

  # ===== Shopify ================================================
  - name: BeamCardShop
    enabled: true
    adapter: shopify
    base_url: https://beamcardshop.com
    max_pages: 4
    include: ["pokémon", "pokemon"]
    exclude: ["sleeve", "toploader", "binder", "playmat", "deck box", "plush", "funko"]

  - name: Bescards
    enabled: true
